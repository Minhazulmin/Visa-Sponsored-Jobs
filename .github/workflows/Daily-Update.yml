
name: Visa-Sponsored Job Listings

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    # Every day at 12:06 UTC (18:06 Bangladesh time)
    - cron: "6 12 * * *"

permissions:
  contents: write

jobs:
  generate-job-list:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------
      # Fetch latest job data
      # ----------------------------------------
      - name: Fetch Latest Job Data
        run: |
          set -e

          echo "Fetching latest job data..."

          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            https://visajobs.xyz/db.json \
            -o jobList.json

          echo "Job data downloaded successfully."

          # Validate JSON
          jq empty jobList.json

          echo "JSON validation successful."

      # ----------------------------------------
      # Generate README
      # ----------------------------------------
      - name: Generate README
        run: |
          set -e

          echo "Generating README.md..."

          cat > README.md <<'EOF'
          # 🌍 Daily List of Visa-Sponsored Job Opportunities

          Welcome to our repository, where we provide a regularly updated list of **visa-sponsored job opportunities** from companies and locations around the world.

          This list is automatically refreshed every day with the latest available opportunities.

          > 💡 **Tip:** Check the application link for each position to view the full job description and application requirements.

          ## 💼 Job Opportunities

          | Company | Job Title | Location | Date Posted | Flag | Application |
          | :--- | :--- | :--- | :--- | :---: | :--- |
          EOF

          jq -r '
            .[] |
            "| " +
            (.company // "N/A" | tostring | gsub("\\|"; "\\|")) +
            " | " +
            (.position // "N/A" | tostring | gsub("\\|"; "\\|")) +
            " | " +
            (
              (.location // "N/A" | tostring) |
              if contains(" ")
              then split(" ")[:-1] | join(" ")
              else .
              end
            ) +
            " | " +
            (.post_date // "N/A" | tostring) +
            " | " +
            (
              (.location // "🌍" | tostring) |
              if contains(" ")
              then split(" ")[-1]
              else "🌍"
              end
            ) +
            " | " +
            (
              if (.description // "") != ""
              then "[Apply](" + (.description | tostring) + ")"
              else "N/A"
              end
            ) +
            " |"
          ' jobList.json >> README.md

          cat >> README.md <<EOF

          ---

          ### 🔄 Last Updated

          **$(date -u +"%Y-%m-%d %H:%M:%S UTC")**

          > This list is automatically updated every day.  
          > Please check back regularly for new visa-sponsored job opportunities.

          ⭐ If you find this repository useful, consider starring it and sharing it with others.
          EOF

          echo "README.md generated successfully."

      # ----------------------------------------
      # Commit and push changes
      # ----------------------------------------
      - name: Commit and Push Changes
        run: |
          set -e

          git config user.name "Automated Workflow"
          git config user.email "actions@users.noreply.github.com"

          git add README.md jobList.json

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit and push."
            exit 0
          fi

          timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          git commit -m "Update visa-sponsored job listings: ${timestamp}"

          # Make sure we are up to date before pushing
          git pull --rebase origin main

          git push origin main

          echo "Changes pushed successfully."
