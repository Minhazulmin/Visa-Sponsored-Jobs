name: Visa-Sponsored Job Listings

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "6 12 * * *"

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download job data
        run: |
          set -e

          curl -fsSL \
            https://visajobs.xyz/db.json \
            -o jobList.json

          jq empty jobList.json

      - name: Generate job table
        run: |
          set -e

          jq -r '
            [
              .[] |
              {
                company: (.company // "N/A"),
                title: (.title // "N/A"),
                location: ((.location // "N/A") | gsub("[\r\n]+"; " ") | gsub(" +"; " ") | .),
                date: (.date // .posted // "N/A"),
                country: (.country // ""),
                url: (.url // .apply_url // .application_url // "")
              }
            ]
            | .[]
            | "| \(.company) | \(.title) | \(.location) | \(.date) | \(.country) | \(if .url != "" then "[Apply](\(.url))" else "N/A" end) |"
          ' jobList.json > job-table.md

      - name: Update README
        run: |
          set -e

          START='<!-- JOB_LIST_START -->'
          END='<!-- JOB_LIST_END -->'

          if ! grep -qF "$START" README.md; then
            echo "ERROR: JOB_LIST_START marker not found in README.md"
            exit 1
          fi

          if ! grep -qF "$END" README.md; then
            echo "ERROR: JOB_LIST_END marker not found in README.md"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          table = Path("job-table.md")

          content = readme.read_text(encoding="utf-8")
          job_table = table.read_text(encoding="utf-8").rstrip()

          start = "<!-- JOB_LIST_START -->"
          end = "<!-- JOB_LIST_END -->"

          start_index = content.index(start) + len(start)
          end_index = content.index(end)

          new_content = (
              content[:start_index]
              + "\n\n"
              + job_table
              + "\n\n"
              + content[end_index:]
          )

          readme.write_text(new_content, encoding="utf-8")
          PY

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "README.md has changed."
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git commit -m "chore: update visa-sponsored jobs"

          git push
