name: Visa-Sponsored Job Listings

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "6 12 * * *"

permissions:
  contents: write

jobs:
  generate-job-list:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ----------------------------------------
      # Fetch latest job data
      # ----------------------------------------
      - name: Fetch Latest Job Data
        run: |
          set -e

          echo "Fetching latest job data..."

          curl -fsSL \
            --retry 3 \
            --retry-delay 5 \
            https://visajobs.xyz/db.json \
            -o jobList.json

          echo "Validating JSON..."

          jq empty jobList.json

          echo "Job data downloaded successfully."

      # ----------------------------------------
      # Generate README
      # ----------------------------------------
      - name: Generate README
        run: |
          set -e

          echo "Generating README.md..."

          cat > README.md <<'EOF'
          # 💼 Job Opportunities

          Welcome to our repository, where we provide a regularly updated list of **visa-sponsored job opportunities** from companies around the world.

          This list is automatically updated every day with the latest available opportunities.

          ## 💼 Job Opportunities

          | Company | Job Title | Location | Date Posted | Application |
          | :--- | :--- | :--- | :--- | :--- |
          EOF

          jq -r '
            def clean:
              tostring
              | gsub("[\\r\\n\\t]+"; " ")
              | gsub("  +"; " ")
              | gsub("^ +| +$"; "");

            def escape:
              clean
              | gsub("\\|"; "\\\\|");

            .[] |
            "| " +
            ((.company // "N/A") | escape) +
            " | " +
            ((.position // "N/A") | escape) +
            " | " +
            ((.location // "N/A") | escape) +
            " | " +
            ((.post_date // "N/A") | escape) +
            " | " +
            (
              if (.description // "") != ""
              then "[Apply](" + (.description | tostring) + ")"
              else "N/A"
              end
            ) +
            " |"
          ' jobList.json >> README.md

          cat >> README.md <<EOF

          ---

          ## 🔄 Last Updated

          **$(date -u +"%Y-%m-%d %H:%M:%S UTC")**

          > This list is automatically updated every day.

          ⭐ If you find this repository useful, consider starring it and sharing it with others.
          EOF

          echo "README.md generated successfully."

      # ----------------------------------------
      # Commit and push changes
      # ----------------------------------------
      - name: Commit and Push Changes
        run: |
          set -e

          git config user.name "Automated Workflow"
          git config user.email "actions@users.noreply.github.com"

          git add README.md jobList.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          git commit -m "Update visa-sponsored job listings: ${timestamp}"

          git pull --rebase origin main

          git push origin main

          echo "Changes pushed successfully."
